name: alfa-bank-newsfeed

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-newsfeed}:${POSTGRES_PASSWORD:-newsfeed}@db:5432/${POSTGRES_DB:-newsfeed}

services:
  db:
    image: postgres:17-alpine
    # без репликации: загрузка TRUNCATE + COPY в одной транзакции не пишет журнал — импорт в разы быстрее
    command: ["postgres", "-c", "wal_level=minimal", "-c", "max_wal_senders=0"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsfeed}
      POSTGRES_USER: ${POSTGRES_USER:-newsfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsfeed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # загрузка CSV кейса в БД; уже загруженные файлы пропускает
  import:
    build:
      context: ./apps/api
      additional_contexts:
        ingest: ./apps/ingest
    command: ["python", "-m", "api.importer"]
    environment:
      <<: *api-env
      DATA_DIR: /data
      IMPORT_FORCE: ${IMPORT_FORCE:-false}
    volumes:
      - ${DATA_DIR:-./data/raw}:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # парсер: снимок новостей и готовая аналитика банка (data/raw/derived/alfa_*.jsonl, если есть) — в БД, затем
  # свежие новости из лент каждые INGEST_EVERY_MIN минут сразу в БД; без сети остаётся загруженное. Модели не
  # вызывает, файлы не пишет. Распознать PDF аналитики — отдельно: docker compose -f apps/ingest/compose.yaml run --rm ingest
  ingest:
    build: ./apps/ingest
    command: ["serve", "--data", "/data"]
    environment:
      <<: *api-env
      INGEST_EVERY_MIN: ${INGEST_EVERY_MIN:-30}
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      additional_contexts:
        ingest: ./apps/ingest
    # ключ и адрес моделей (LLM_API_KEY, LLM_BASE_URL) — из .env в корне; без них агент отвечает 503, остальное работает
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      DATA_DIR: /data
      NEWS_SNAPSHOT: /demo/news_snapshot.jsonl
      LLM_CACHE_DIR: /cache/llm
      IMG_CACHE_DIR: /cache/img
      LLM_JOURNAL: /cache/llm_calls.jsonl
      LLM_DAILY_BUDGET_RUB: ${LLM_DAILY_BUDGET_RUB:-150}
    volumes:
      # разобранные новости и аналитика (data/raw/derived) — только чтение; кэш и журнал моделей — свой том
      - ${DATA_DIR:-./data/raw}:/data:ro
      - ./data/demo:/demo:ro
      - llmcache:/cache
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  llmcache:
