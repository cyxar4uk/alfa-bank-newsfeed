# Открытые ленты новостей. Добавить источник — дописать блок [[feed]], код менять не нужно.
# Из ленты берём только заголовок, лид дословно (до 500 знаков), ссылку на материал и дату; полный текст
# статей и картинки не храним, в интерфейсе всегда ведём ссылкой на первоисточник.
# priority — какой издатель остаётся главным при склейке дублей (меньше — главнее): регулятор раньше СМИ.
# enabled = false — источник выключен из-за условий использования или недоступности, причина в terms.

