# Каталог источников для бизнеса: что уже подключено и что можно подключить. Отдаёт GET /api/sources/catalog.
# Проверено 24.10.2026 по официальным страницам из docs_url; чего не нашли в документации — так и написано в note.
#
# country — ru | intl; kind — free (открытая лента или бесплатный API) | paid_api (доступ по договору или подписке).
# reliability — те же уровни, что у лент в sources.toml: official, agency, business_media, other.
# feeds — id лент из sources.toml: источник подключён, если включена хотя бы одна.
# key_env — у платных: переменная в .env на сервере, куда кладут ключ. В прототипе ключи не принимаем, а коннекторов
#   к платным API нет: источник из этого раздела подключается доработкой парсера.

