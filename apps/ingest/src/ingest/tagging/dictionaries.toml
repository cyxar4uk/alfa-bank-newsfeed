# Словари разметки без LLM. Расширить — дописать блок, код менять не нужно.
# patterns — регулярные выражения по тексту в нижнем регистре, «ё» заменено на «е».
# Каждый шаблон проверяется с начала слова, поэтому достаточно основы: 'инфляц' найдёт «инфляция», «инфляционных».
# Тип события — первый сработавший по порядку блоков.

# ---------- Темы ----------

[[topic]]
name = "ключевая ставка"
patterns = ['ключев\w* ставк', 'ставк\w* (цб|банка россии)', 'денежно-кредитн', 'дкп\b', 'смягчени\w* (дкп|политик)', 'ужесточени\w* (дкп|политик)']

[[topic]]
name = "инфляция"
patterns = ['инфляц', 'дефляц', 'рост\w* цен\b', 'потребительск\w* цен', 'подорожа', 'ипц\b']

[[topic]]
name = "валюта"
patterns = ['курс\w* (рубл|доллар|евро|юан|валют)', 'рубл\w* (укреп|ослаб|подешев|подорож)', '(укреплени|ослаблени)\w* рубл', 'валют', 'доллар', 'юан', 'евро\b']

[[topic]]
name = "нефть и газ"
patterns = ['нефт', 'газ(?!ет|промбанк)', 'спг\b', 'нпз\b', 'бензин', 'дизел', 'топлив', 'опек', 'brent', 'urals', 'газпром(?!банк)', 'роснефт', 'лукойл', 'новатэк']

[[topic]]
