patterns = ['сырь', 'сырьев', 'уголь', 'угл(я|ем|ей)\b', 'угольн', 'зерн', 'пшениц', 'удобрени', 'древесин', 'лесоматериал', 'commodit', 'биржев\w* товар']

[[topic]]
