# Словари разметки без LLM. Расширить — дописать блок, код менять не нужно.
# patterns — регулярные выражения по тексту в нижнем регистре, «ё» заменено на «е».
# Каждый шаблон проверяется с начала слова, поэтому достаточно основы: 'инфляц' найдёт «инфляция», «инфляционных».
#
# Сила связи новости с фактором или отраслью, 0–1 (пороги как у карты чувствительности: высокая ≥ 0,6, средняя ≥ 0,3):
#   strong в заголовке — 1,0; weak в заголовке или strong в лиде — 0,6; weak только в лиде — 0,3;
#   каждое следующее совпадение +0,1, не больше 1,0.
# Тип события — первый сработавший по порядку блоков.
#
# exclude у записи — фразы, в которых её шаблоны не считаются: «35 миллионов евро» — сумма, а не курс евро.
# [noise] — фразы, которые не говорят ни о факторе, ни об отрасли, ни о регионе («Золотой мяч», «взрыв газа»):
# их стирают из текста до поиска. Тип события и страны ищутся по всему тексту.

[noise]
patterns = [
    # спорт и награды: «золото» и «серебро» здесь — медали, а не металлы
    'золот\w* (мяч|медал|призер|бутс|глобус|маск|граммофон|орел|орл|кольц|рыбк|ключик|свадьб)',
    '(золот|серебр)\w* (олимпиад|чемпионат|первенств|турнир|игр)',
    'завоева\w* (\w+ )?(золот|серебр)\w*',
    '(олимпийск|чемпионск)\w* (золот|серебр)',
    'серебрян\w* (медал|призер)',
    # памятные монеты Банка России: сплав монеты — не рынок металлов, номинал — не курс рубля
    'памятн\w* (\w+ ){0,3}монет\w*( из (золота|серебра|драгоценн\w* металл\w*))?',
    'серебрян\w* монет',
    'монет\w* из серебра',
    'масс\w* драгоценного металла',
    # бытовой газ, газ как оружие и Газа как место; «тарифы на бытовой газ» — это газ
    '(взрыв|хлопк)\w* (бытового )?газа',
    'газовоздушн',
    'утечк\w* (бытового )?газа (в|на) (жил|многоквартирн|частн|дом|квартир|подъезд|кафе|школ)',
    'угарн\w* газ',
    'отрав\w* (\w+ )?газом',
    'газов\w* (баллон|колонк|плит)',
    'слезоточив\w* газ',
    '(город\w*|сектор\w*|анклав\w*) газа',
    '(удар\w*|наступлени\w*|операци\w*|обстрел\w*) (\w+ )?(по|в|на) газ(е|у|ы|а)\b',
    'в газе\b',
    # метафоры и происшествия
    'стальн\w* (стен|хватк|нерв|кулак|купол|характер)',
    'черн\w* риелтор',
    'мошенни\w* (\w+ )?с (недвижимост|жиль|квартир)',
]

# Регион — фактор «события региона», только если новость про экономику региона: без этих слов «Москва» в новости о ДТП,
# футболе или погоде остаётся местом (tags.regions), но фактором не становится.
[region_economy]
patterns = [
    'налог', '(торгов|туристическ|курортн|транспортн)\w* сбор', 'патент', 'пошлин', 'тариф',
    '(региональн|городск|областн|краев|республиканск|муниципальн)\w* (бюджет|заказ|закуп|программ|поддержк|льгот|субсиди|власт\w* (ввел|снизил|повысил|утвердил|выделил))',
    'бюджет', 'госзаказ', 'госзакуп', 'закупк', 'нацпроект',
    'аренд', 'земл\w* (под|для)', 'земельн', 'кадастр', 'участк\w* (под|для) (строительств|застройк|производств|склад)', 'застройк', 'девелопер', 'новостро',
    'ограничени\w* (движени|въезд|для (грузов|большегруз|фур|транспорт))', '(ввел|введ|снял|сня|продлил|продлен)\w* (\w+ )?ограничени', '(платн|ограничен)\w* (въезд|парковк|дорог)','грузов\w* (каркас|транспорт|рейс|перевоз)', 'большегруз', 'перекрыти\w* (дорог|трасс|мост)',
    'мер\w* поддержк', 'поддержк\w* (бизнес|предприним|мсп|малого|производител|инвестор)', 'субсиди', 'грант\w* (для|на) (бизнес|предприним|мсп|производ)', 'льгот', 'инвестпроект', 'особ\w* экономическ\w* зон', 'технопарк', 'промпарк', 'индустриальн\w* парк',
    '(для|на) (бизнес|предпринимател)', 'мсп\b', 'малого и среднего', 'торгов\w* (сбор|объект|точк|площад)', 'нестационарн',
]

# Слова о бизнесе вообще: не делают новость деловой сами по себе, но с ними новость с не деловой категорией
# (атака беспилотников, протесты) не отсеивается словарями, а уходит модели — «ритейлеры запросили господдержку
# после атак», «Дания задерживает суда с российскими грузами».
[business_words]
patterns = [
    'бизнес', 'предприним', 'компани', 'ритейлер', 'производител', 'промышлен', 'промзон', 'промобъект', 'завод',
    'предприят', 'экономик', 'экономическ', 'рын(ок|ка|ке|ки|ков)\b', 'груз', 'суд(а|ов|ам)\b', 'трубопровод',
    'газопровод', 'поток(а|ов|и)?\b', 'банк', 'кредит', 'господдержк', 'поддержк', 'убыт', 'ущерб', 'страхов',
    'выручк', 'прибыл', 'инвест', 'поставк', 'логист', 'аэропорт', 'рейс', 'энерг', 'электро', 'тариф', 'цен(а|ы|ах|ам)\b',
    'заказ', 'контракт', 'закуп', 'порт(а|у|ы|ов|ах)?\b', 'продаж', 'терминал', 'нефтебаз', 'завод', 'купил', 'сделк',
    'млн\b', 'млрд\b', 'миллион', 'миллиард', 'рубл', 'доход', 'урожа', 'посев',
]

# Не деловые новости: происшествия, спорт, культура, погода, светская хроника, протокол, политические заявления
# без экономики. Ищутся в заголовке. Если в заголовке есть сильный деловой признак (фактор или отрасль из словаря),
# новость остаётся деловой — «атака беспилотников на НПЗ» про топливо. strict = true — категория сильнее отрасли
# («Локомотив» проиграл — не РЖД), но не фактора: «футбольные клубы получат налоговые льготы» решит модель;
# strict = "always" — сильнее и фактора: поздравление таможенников остаётся поздравлением. Слова о бизнесе в
# заголовке сильнее любой категории. Сомнительное (только слабые признаки) решает модель.
[[offtopic]]
name = "протокол и поздравления"
strict = "always"
patterns = ['поздрави', 'поздравлени', 'соболезновани', 'профессиональн\w* праздник', 'день (рождения|памяти|работник|сотрудник)', 'вручил\w* (орден|медал|грамот)', 'возлож\w* (цвет|венк)']

[[offtopic]]
name = "спорт"
strict = true
patterns = ['футбол', 'хокке', 'баскетбол', 'волейбол', 'теннис', 'бокс(е|а|ер\w*|ерск\w*)?\b', 'ufc\b', 'мма\b', 'фигурист', 'биатлон', 'лыжн\w* гонк', 'шахмат', 'олимпи', 'паралимпи', 'чемпионат\w* (мира|европы|россии) по', 'первенств\w* по', 'турнир', 'матч', 'гол(ом|а|ы)?\b', 'вратар', 'нападающ', 'полузащитник', 'тренер\w* (сборн|клуб|команд)', 'сборн\w* (россии|по)', '\bрпл\b', '\bкхл\b', '\bнхл\b', 'тяжел\w* атлетик', 'легк\w* атлетик', 'спортсмен', 'проиграл\w* (в гостях|дома|на выезде)','обыграл', 'сыграл\w* вничью', 'в гостях', 'на выезде']

[[offtopic]]
name = "погода"
patterns = ['синоптик', 'погод(а|ы|е|у)\b', 'гидрометцентр', 'похолодани', 'потеплени', 'снегопад', 'ливн', 'гроз(а|ы)\b', 'морозы?\b', 'жар(а|ы)\b', 'придет зима', 'аномальн\w* (жар|холод|тепл)']

[[offtopic]]
name = "происшествия и криминал"
patterns = ['дтп\b', 'сбил\w* (пешеход|ребенк|женщин|мужчин|человек)', 'мотоциклист', 'погиб', 'гибел', 'пострадал', 'ранени', 'ранен(ы|о)?\b', 'убийств', 'убит', 'убил', 'зарезал', 'изнасил', 'похити', 'похищени', 'младен', 'пропал\w* (без вести|ребен|девоч|мальч|подрост)', 'утонул', 'самоубийств', 'избил', 'драк', 'стрельб', 'поножовщин', 'наркоти', 'закладчик', 'педофил', 'отчим', 'сожител', 'задержал\w* (подозреваем|пьян|водител)', 'пожар\w* (в|на) (жил|квартир|частн|доме|дачн|общежит)', 'спасател\w* (достал|эвакуир|нашли)']

[[offtopic]]
name = "боевые действия"
patterns = ['атак\w* (бпла|беспилот|всу|дронов)', 'беспилотник', '\bбпла\b', 'дрон(ы|ов|ами)?\b', 'обстрел', 'всу\b', '\bпво\b', 'сбит\w* (беспилот|бпла|дрон|ракет)', 'теракт', 'акт\w* террор', 'удар\w* (всу|по (жил|автобус|город|сел))', 'минобороны', 'военн\w* (операци|учени)']

[[offtopic]]
name = "культура и досуг"
patterns = ['балет', 'театр', 'спектакл', 'опер(а|ы|е|у)\b', 'концерт', 'музе(й|я|е|ю)\b', 'выставк\w* (картин|художник|фотограф|искусств)', 'современн\w* искусств', 'художник', 'кинофестивал', 'фестивал', 'сериал', 'фильм', 'режиссер', 'актер', 'актрис', 'певиц', 'певец', 'рэпер', 'артист', 'премьер\w* (фильм|спектакл|балет|оперы|сериал)', 'зоопарк', 'экскурси', 'книжн\w* (ярмарк|фестивал)', 'писател', 'поэт(а|у|ом|ы)?\b']

[[offtopic]]
name = "светская хроника"
patterns = ['свадьб', 'развел', 'развод\w* (звезд|актер|певиц|блогер)', 'беремен', 'родил\w* (сын|дочь|ребенк)', 'блогер', 'звезд\w* (шоу|сериал|эстрад|кино)', 'светск', 'инстаграм', 'тикток']

[[offtopic]]
name = "политические заявления"
patterns = ['традиционн\w* ценност', '(свои|своих|европейск\w*|западн\w*|семейн\w*|духовн\w*) ценност', 'мигрант\w* (ассимил|ценност|интеграц)', 'ассимил', 'песков (ответил|заявил|прокомментир|рассказал)', 'визит\w* (трампа|президент|премьер|делегац)', 'переговор', 'выбор(ы|ах|ов)\b', 'протест(ы|ов|ам|ах|ующ\w*|н\w*)?\b', 'митинг', 'оппозици', 'русофоб', 'нато\b', 'генсек\w* оон']

# ---------- Факторы: каталог карты чувствительности (фича B) ----------
# demand_<сектор> и supply_<сектор> у компании считаются по платежам; новость даёт для них отрасли с силой связи.
# region — из найденных регионов. implies — отрасли, которых фактор касается напрямую: сила = сила фактора × вес.

[[factor]]
code = "rate"
name = "стоимость заёмных денег"
strong = ['ключев\w* ставк', 'ставк\w* (цб|банка россии)', 'денежно-кредитн', 'дкп\b', 'смягчени\w* (дкп|денежно)', 'ужесточени\w* (дкп|денежно)', 'стоимост\w* (заимствовани|кредит|денег)', 'ставк\w* по кредит', 'льготн\w* (ипотек|кредит)']
weak = ['кредитов(ани|ый|ого|ые|ых)', 'кредит(а|ы|ов|ам|ами)?\b', 'заем', 'займ', 'заимствован', 'долгов\w* нагрузк', 'рефинансир', 'ипоте[кч]', 'облигац', 'офз\b', 'доходност\w* (офз|облигац|кривой)', 'ruonia', 'ключев\w* ставк']

[[factor]]
code = "deposit_yield"
name = "доходность свободных денег"
strong = ['ставк\w* (по )?(депозит|вклад)', 'доходност\w* (депозит|вклад)', 'депозитн\w* ставк', 'флоатер', 'флоутер', 'денежн\w* рын', 'фонд\w* денежного рынка']
weak = ['депозит(?!ар)', 'вклад(ы|ов|ах|чик)', 'ключев\w* ставк', 'офз\b', 'облигац', 'доходност']

[[factor]]
code = "fx"
name = "курс валют"
strong = ['курс\w* (рубл|доллар|евро|юан|валют)', 'рубл\w* (укреп|ослаб|подешев|подорож)', '(укреплени|ослаблени|девальваци)\w* рубл', 'валютн\w* (курс|рын|выручк|контрол|риск)', 'обязательн\w* продаж\w* валютн']
weak = ['валют(?!н\w* фонд)', 'доллар', 'юан', 'евро\b', 'рубл[ьяе]\b']
# валюта как единица суммы («35 миллионов евро», «116 долларов за баррель») — не событие курса; цифровые валюты — не курс.
# «1 евро превысил 100 рублей» и «к концу 2026 юань…» — курс: единица и год перед валютой суммой не считаются
exclude = ['(?!1\s|(19|20)\d\d\s)\d+([\s.,]\d+)*\s*(тыс\.|тысяч\w*|млн|млрд|трлн|миллион\w*|миллиард\w*|триллион\w*)?\s*(евро|доллар\w*|рубл\w*|юан\w*)', '(тысяч|миллион|миллиард|триллион|млн|млрд|трлн)\w*\s+(евро|доллар\w*|рубл\w*|юан\w*)', 'цифров\w* (рубл|юан|доллар|евро)']

[[factor]]
code = "ved_logistics"
name = "санкции, платежи и логистика ВЭД"
strong = ['санкц', 'эмбарго', 'вэд\b', 'внешнеэконом', 'внешнеторг', 'таможен', 'экспортн\w* пошлин', 'импортн\w* пошлин', 'пошлин', 'параллельн\w* импорт', 'трансграничн\w* (платеж|перевод|расчет)', 'потолок цен', 'недружественн', 'вторичн\w* санкц', '(экспорт|импорт|поставк|поставит|поставля)\w* (\w+ ){0,3}(дизел|топлив|нефт|газа|спг|зерн|пшениц|удобрен|угл(я|ем)\b|уголь|металл|стал(ь|и|ью)\b)']
weak = ['экспорт', 'импорт', 'дружественн\w* стран', 'порт(а|у|ы|ов|ах)?\b', 'контейнер', 'судоход', 'фрахт', 'морск\w* (перевоз|достав|логист)', 'погранперех', 'пункт\w* пропуска', 'платеж\w* (за рубеж|из-за рубеж|в китай|в юан)', 'расчет\w* в (юан|рубл|нацвалют)']

[[factor]]
code = "consumer"
name = "потребительский спрос"
# «Неделя потребления» — рубрика Коммерсанта про выставки, балет и рестораны, а не спрос
exclude = ['недел\w* потреблени']
strong = ['потребительск\w* (спрос|расход|активн|настроени|кредит)', 'потреблени(?!\w* (электро|энерг|газа|топлив|воды|тепл|мощност))', 'розничн\w* (торговл|продаж|спрос)', 'оборот\w* (розничн|торговл)', 'покупательск\w* (спрос|способност|активн)', 'реальн\w* (располагаем|доход)']
weak = ['ритейл', 'маркетплейс', 'торгов\w* сет', 'пвз\b', 'пункт\w* выдачи', 'магазин', 'продаж\w* (автомобил|машин|квартир|жиль)', 'wildberries', 'ozon', 'спрос(?!и|ят)']

[[factor]]
code = "labor"
name = "рынок труда и зарплаты"
strong = ['безработ', 'рын\w* труда', 'зарплат', 'заработн\w* плат', 'дефицит\w* (кадров|работник|персонал)', 'кадров\w* (дефицит|голод)', 'занятост', 'мрот\b']
weak = ['ваканс', 'мигрант', 'численност\w* (работник|персонал|сотрудник)', 'найм', 'увольнени', 'персонал']

[[factor]]
code = "gov"
name = "госрасходы и бюджет"
strong = ['(федеральн|государственн|региональн|консолидированн)\w* бюджет', 'бюджет\w* (рф|россии|страны|регион|на 20)', 'бюджетн\w* (правил|дефицит|расход|доход|кодекс|систем|политик)', 'госрасход', 'расход\w* (бюджет|государств)', 'госзакуп', 'госзаказ', 'гособоронзаказ', 'нацпроект', 'национальн\w* проект', 'фнб\b', 'фонд\w* национального благосостояния', 'госдолг', 'дефицит\w* бюджет']
weak = ['(?<!рекламный )(?<!рекламного )(?<!семейный )(?<!семейного )(?<!маркетинговый )бюджет', 'субсиди', 'господдержк', 'государственн\w* (поддержк|контракт|программ)', 'минфин', 'бюджетн', 'размещени\w* офз']
# чужой минфин — не российский бюджет
exclude = ['минфин\w* (сша|великобритании|британии|германии|франции|италии|японии|китая|кнр|индии|турции|ирана|израиля|канады|украины|казахстана|беларуси|белоруссии|армении|узбекистана|ес)\b']

[[factor]]
code = "commodity_metals"
name = "сырьё: металлы"
strong = ['цен\w* на (сталь|металл|никел|алюмини|мед|чугун|металлопрокат|жрс|железн\w* руд)', 'металлург', 'сталь', 'сталел', 'стального', 'никел', 'алюмини', 'меди\b', 'медь', 'жрс\b', 'железн\w* руд', 'северстал', 'нлмк', 'ммк\b', 'норникел', 'русал', 'евраз\b', 'мечел']
weak = ['металл', 'чугун', 'металлопрокат', '(плоск|сортов|листов|горячекатан|холоднокатан)\w* прокат', 'лом\w* черных', 'платин', 'паллади', 'серебр']
implies = { "07" = 1.0, "24" = 1.0, "25" = 0.6 }

[[factor]]
