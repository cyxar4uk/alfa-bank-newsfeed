# Новость только о других странах: названа чужая страна, нет российского региона и ни одного признака из domestic.
# Тогда факторы из factors не ставятся — пошлины США для Канады и лицензии Минфина США не про нашу торговлю и не про
# наше регулирование, — а отрасли, названные в тексте, не сильнее sector_cap: событие за рубежом задевает отрасль
# косвенно («в Киеве отключили электроэнергию» — не новость российской энергетики). Отрасли через сырьевые факторы не
# трогаем: цены на нефть, металлы и зерно мировые.
[foreign]
factors = ["ved_logistics", "tax_regulation"]
sector_cap = 0.3
# торговые слова: одна чужая страна и торговля — наша торговля с ней («импорт автомобилей из Китая»)
# и выход наших компаний за рубеж: рейсы, продажи, открытие отделения или склада («Аэрофлот возобновил рейсы в Египет»)
trade = ['импорт', 'экспорт', 'ввоз', 'вывоз', 'поставк', 'закуп', 'пошлин', 'санкц', 'эмбарго', 'товарооборот', 'рейс', 'авиасообщ', 'перелет', 'турист', 'тур(ы|ов)\b', 'продаж', 'открыл', 'открыт', 'запуст', 'выш\w* (в|на)\b', 'выход\w* на рын', 'границ', 'отделени', 'филиал', 'склад', 'представительств']
# российские признаки: страна, рубль, ведомства, крупные компании и бренды из словаря отраслей, «наши»
domestic = ['росси', 'российск', 'рф\b', 'рубл', 'отечествен', 'москв', 'петербург', 'подмосков', 'госдум', 'минфин', 'минэнерго', 'минпромторг', 'минэк', 'минсельхоз', 'минтранс', 'минцифр', 'минстрой', 'минздрав', 'цб\b', 'банк\w* росси', 'фас\b', 'фнс\b', 'рос(авиац|потребнадзор|стат|стандарт|реестр|финмониторинг)', 'мосбирж', 'московск\w* бирж', 'лукойл', 'роснефт', 'газпром', 'новатэк', 'сибур', 'фосагро', 'акрон', 'алроса', 'сбер(?!еж|егат)', 'втб\b', 'альфа-банк', 'т-банк', 'тинькофф', 'ржд\b', 'росатом', 'ростех', 'русал', 'норникел', 'северстал', 'евраз', 'нлмк', 'ммк\b', 'аэрофлот', 'ozon', 'озон\b', 'wildberries', 'вайлдберриз', 'x5\b', 'магнит\b', 'яндекс', 'vk\b', 'вконтакт', 'автоваз', 'камаз', 'мтс\b', 'мегафон', 'ростелеком', 'наш\w* (банк|компан|рын|экономик|экспорт|импорт|бизнес|производител|страна|стране)']
# ведомство чужой страны — не российский признак: «Минфин США», «Минфина Великобритании», «ЦБ Турции»
domestic_exclude = ['(минфин|минэк\w*|минэнерго|минтранс|министерств\w* финансов|цб|центробанк|центральн\w* банк|нацбанк|национальн\w* банк)\w* (сша|америк\w*|великобритан\w*|британ\w*|англи\w*|германи\w*|франци\w*|итали\w*|испани\w*|япони\w*|китая|кнр|турци\w*|инди\w*|ирана|израил\w*|канады|украин\w*|казахстан\w*|беларус\w*|белорусси\w*|армени\w*|узбекистан\w*|европ\w*|ес\b|еврозон\w*)']
