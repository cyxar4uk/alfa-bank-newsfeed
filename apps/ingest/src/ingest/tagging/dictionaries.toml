patterns = ['металл', 'сталь', 'сталел', 'стального', 'чугун', 'никел', 'алюмини', 'меди\b', 'медь', 'золот', 'серебр', 'платин', 'паллади', 'жрс\b', 'железн\w* руд', 'северстал', 'нлмк', 'ммк\b', 'норникел', 'русал', 'полюс\b']

[[topic]]
