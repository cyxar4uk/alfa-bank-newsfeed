[project]
name = "ingest"
version = "0.1.0"
description = "Сбор новостей и аналитики Альфа-Банка: нормализация, склейка дублей, разметка"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ingest = "ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
