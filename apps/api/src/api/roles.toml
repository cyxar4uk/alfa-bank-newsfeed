# Ранжирование ленты: веса ролей и параметры оценки события.
#
# Оценка события для пользователя (api/ranking.py):
#   слагаемые: факторы события (сила события по фактору × чувствительность компании × вес роли)
#            и каналы цепочки (сила канала × вес роли для канала × chain_weight);
#   фактор и канал с одним основанием (своя отрасль, покупатели, поставщики, группа) — один, больший;
#   сырая = Σ слагаемых по убыванию × next_term^i (i — место слагаемого)
#   оценка = сырая / (1 + сырая) × свежесть × качество источника + бонус за позицию банка
# Слагаемые разложения пропорциональны вкладам и в сумме дают оценку.
# Вес роли — множитель к фактору: 1 — нейтрально, больше — роли это важнее. Не указан — 1.
# Ключи: код фактора карты (rate, fx…), префикс с * (commodity_*), канал цепочки (chain:buyers, chain:suppliers,
# chain:group, chain:direct).

version = "2026-10-24.3"

# факторы, которые задают российская экономика и регулирование: зарубежное событие (закон в Конгрессе США,
# спрос во Франции) их не меняет, если у компании, её группы и крупных контрагентов нет ВЭД с этими странами
domestic = ["rate", "deposit_yield", "inflation", "consumer", "labor", "gov", "tax_regulation"]
# внешняя торговля: событие между другими странами (пошлины США для Канады) — только при ВЭД компании с ними
trade = ["ved_logistics"]

[scoring]
chain_weight = 1.0
# свежесть: множитель 0,5 за каждые half_life_days дней, не ниже min_freshness
half_life_days = 14
min_freshness = 0.3
bank_view_bonus = 0.05
# события с оценкой ниже — не в ленте: не касаются компании
min_score = 0.03
# k-е повторение главной причины в ленте — оценка × repeat_factor^k: лента не из одной темы
repeat_factor = 0.9
# повтор профильной темы (нефть у топливного холдинга) не опускает касающееся событие (оценка ≥ 0,3) ниже 0,3:
# лента показывает все касающиеся события такой темы, а штраф только сдвигает их ниже
repeat_floor = 0.3
# после третьего повтора штраф не растёт: десятое событие профильной темы не хуже четвёртого
repeat_max = 3
# ...только если чувствительность компании к главному фактору события не ниже (профильная тема)
repeat_floor_exposure = 0.6
# второе по силе слагаемое события — × next_term, третье — × next_term², …: новость с десятком слабых
# тегов не обгоняет профильную
next_term = 1.0
# зарубежное событие без связи компании с его странами: внутренние факторы (domestic) — × foreign_factor
foreign_factor = 0.3
# событие без факторов сразу о многих отраслях: сила каждой × sector_focus / сумма сил по укрупнённым
# отраслям (api.okved), если сумма больше sector_focus; 0 — не делить
sector_focus = 1.0

# коды факторов в разметке новостей, которые в карте называются иначе
[aliases]
commodity_oil_gas = "commodity_oil"

# качество источника — множитель 0–1; не указан — default
[sources]
default = 0.9
"Банк России" = 1.0
"Интерфакс" = 1.0
"Коммерсантъ" = 0.95
"РИА Новости" = 0.9
"Forbes" = 0.85

# издателя нет в [sources] — множитель по надёжности ленты (reliability в apps/ingest/src/ingest/news/sources.toml)
[source_tiers]
official = 1.0
agency = 0.95
business_media = 0.9
other = 0.8

