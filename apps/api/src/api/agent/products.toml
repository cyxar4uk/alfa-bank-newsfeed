# Правила «риск → продукт» для инструмента get_products_for_risk (фича H).
# Источник — каталог продуктов команды по открытым страницам Альфа-Банка. Ставок и лимитов в текстах нет:
# для крупного бизнеса условия индивидуальные. Предложение — только при силе риска не ниже средней.
#
# factor   — код фактора карты; `demand_*` / `supply_*` — любой сектор
# product  — значение Action.product из контракта
# feature  — признак «продукт уже есть»: тогда текст has_text («проверьте условия»), иначе new_text
# roles    — кому показываем (пусто — всем); главбуху предложения по умолчанию не показываем
# {sector} и {share} подставляются из канала цепочки, если они есть

[[rule]]
factor = "demand_*"
product = "factoring"
name = "Факторинг"
feature = "feat:FACTORING_MARK"
has_text = "Проверьте лимит факторинга по покупателям из отрасли «{sector}» — на них {share} поступлений."
new_text = "Факторинг снимет риск отсрочек от покупателей из отрасли «{sector}»: банк заплатит за отгрузку сразу, а долг покупателя заберёт на себя."
roles = ["owner", "ceo", "cfo", "treasury"]

[[rule]]
factor = "gov"
product = "guarantee"
name = "Банковские гарантии"
feature = "feat:CL_PRODUCT_GAR_MARK"
has_text = "Проверьте лимит банковских гарантий под новые торги."
new_text = "Банковская гарантия позволит участвовать в торгах, не замораживая оборотные средства."
roles = ["owner", "ceo", "cfo"]

[[rule]]
factor = "rate"
product = "credit"
name = "Кредитование"
feature = "feat:CL_PRODUCT_LOA_MARK"
has_text = "Обсудите с менеджером структуру долга: по прогнозу банка ставка дольше останется высокой."
new_text = ""
roles = ["owner", "ceo", "cfo", "treasury"]

[[rule]]
factor = "rate"
product = "leasing"
name = "Лизинг Альфа-Лизинга"
feature = "feat:CL_PRODUCT_LEA_MARK"
has_text = "Проверьте график лизинговых платежей: ставка по прогнозу банка дольше останется высокой."
new_text = "Для обновления техники — лизинг Альфа-Лизинга с графиком платежей под сезонность."
roles = ["owner", "ceo", "cfo"]

[[rule]]
factor = "deposit_yield"
product = "deposit"
name = "Депозиты для бизнеса"
feature = "feat:CL_PRODUCT_DEP_MARK"
has_text = "Проверьте сроки размещения: банк ждёт снижения ставки к концу 2027 года, длинный депозит зафиксирует доход."
new_text = "Разместите свободные деньги в депозите — доход фиксируется на дату размещения."
roles = ["owner", "cfo", "treasury"]

[[rule]]
factor = "fx"
product = "fx"
name = "Хеджирование валютных рисков"
feature = ""
has_text = ""
new_text = "Зафиксируйте курс будущих платежей — обсудите с менеджером форвард или опцион."
roles = ["owner", "ceo", "cfo", "treasury"]

[[rule]]
factor = "ved_logistics"
product = "fx"
name = "Валютный контроль и ВЭД"
feature = ""
has_text = ""
new_text = "Менеджер ВЭД поможет с платёжным маршрутом и валютным контролем."
roles = ["ceo", "cfo", "treasury"]
